        const App = () => {

            const [itemsPerPage] = React.useState(50);
            const [selectedVoice, setSelectedVoice] = React.useState('US');
            
            // 測驗狀態
            const [quizMode, setQuizMode] = React.useState(null); // null, 'listening', 'meaning', 'spelling'
            const [quizWord, setQuizWord] = React.useState(null);
            const [quizOptions, setQuizOptions] = React.useState([]);
            const [userInput, setUserInput] = React.useState('');
            const [quizFeedback, setQuizFeedback] = React.useState(null);
            const [isCollocationType, setIsCollocationType] = React.useState(false);

            // 確保手機版瀏覽器在載入時，強制先去要一次系統的語音清單
            React.useEffect(() => {
                if (window.speechSynthesis) {
                    window.speechSynthesis.getVoices();
                    window.speechSynthesis.onvoiceschanged = () => {
                        window.speechSynthesis.getVoices();
                    };
                }
            }, []);

            const validData = React.useMemo(() => {
                return rawVocabularyData
                    .filter(item => Array.isArray(item) && item.length >= 6 && item[1])
                    .map((item, index) => ({
                        id: index + 1,
                        ch: item[0],
                        word: item[1] ? item[1].trim() : "",
                        translation: item[2] ? item[2].trim() : "",
                        collocation: item[3] ? item[3].trim() : "",
                        en_sentence: item[4] ? item[4].trim() : "",
                        ch_sentence: item[5] ? item[5].trim() : ""
                    }));
            }, []);

            const filteredData = React.useMemo(() => {
                return validData.filter(item => {
                    const matchSearch = item.word.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                        item.translation.includes(searchTerm) ||
                                        item.collocation.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchChapter = selectedChapter === 'all' || item.ch.toString() === selectedChapter;
                    return matchSearch && matchChapter;
                });
            }, [searchTerm, selectedChapter, validData]);

            const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
            const currentData = filteredData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            const handleSpeak = (text) => {
                if (!window.speechSynthesis) return;
                
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                utterance.pitch = 1.0; 
                
                const langMap = { 'US': 'en-US', 'UK': 'en-GB', 'AU': 'en-AU' };
                const targetLang = langMap[selectedVoice] || 'en-US';
                utterance.lang = targetLang; 
                
                const voices = window.speechSynthesis.getVoices();
                
                if (voices && voices.length > 0) {
                    let matchingVoices = voices.filter(v => v.lang.replace('_', '-') === targetLang);
                    
                    if (matchingVoices.length === 0) {
                        matchingVoices = voices.filter(v => v.lang.startsWith('en'));
                    }

                    if (matchingVoices.length > 0) {
                        matchingVoices.sort((a, b) => {
                            const nameA = a.name.toLowerCase();
                            const nameB = b.name.toLowerCase();
                            let scoreA = 0;
                            let scoreB = 0;
                            
                            const premiumWords = ['natural', 'online', 'premium', 'enhanced', 'google'];
                            premiumWords.forEach(word => {
                                if (nameA.includes(word)) scoreA += 3;
                                if (nameB.includes(word)) scoreB += 3;
                            });
                            
                            const appleGoodVoices = ['samantha', 'daniel', 'karen', 'alex'];
                            appleGoodVoices.forEach(word => {
                                if (nameA.includes(word)) scoreA += 2;
                                if (nameB.includes(word)) scoreB += 2;
                            });

                            if (nameA.includes('compact') || nameA.includes('siri')) scoreA -= 2;
                            if (nameB.includes('compact') || nameB.includes('siri')) scoreB -= 2;

                            return scoreB - scoreA; 
                        });
                        utterance.voice = matchingVoices[0];
                    }
                }
                window.speechSynthesis.speak(utterance);
            };

            const handlePageChange = (newPage) => {
                if (newPage >= 1 && newPage <= totalPages) {
                    setCurrentPage(newPage);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            const handleJumpPage = (e) => {
                if (e.key === 'Enter' || e.type === 'click') {
                    const page = parseInt(jumpPage, 10);
                    if (page >= 1 && page <= totalPages) {
                        handlePageChange(page);
                    }
                    setJumpPage('');
                }
            };

            const generateOptions = (correctItem, data) => {
                const options = [correctItem];
                while (options.length < 4) {
                    const randomItem = data[Math.floor(Math.random() * data.length)];
                    if (!options.find(opt => opt.id === randomItem.id)) {
                        options.push(randomItem);
                    }
                }
                return options.sort(() => Math.random() - 0.5);
            };

            const startQuiz = (mode) => {
                // 嚴格鎖定使用者選擇的章節，徹底排除搜尋列的干擾
                const quizData = selectedChapter === 'all' 
                    ? validData 
                    : validData.filter(item => item.ch.toString() === selectedChapter);

                    return;

                const randomItem = quizData[Math.floor(Math.random() * quizData.length)];

                setUserInput('');

                setQuizMode(mode);

                const isColloc = mode === 'meaning' && randomItem.collocation && Math.random() > 0.5;
                setIsCollocationType(isColloc);
                
                if (mode === 'listening' || mode === 'meaning') {
                    setQuizOptions(generateOptions(randomItem, quizData));
                }
                
                if (mode === 'meaning') {
                    handleSpeak(isColloc ? randomItem.collocation : randomItem.word);
                } else {
                    handleSpeak(randomItem.word);
                }
            };

            const handleChoiceSubmit = (selectedItem) => {
                if (quizFeedback) return;
                if (selectedItem.id === quizWord.id) {
                    setQuizFeedback('correct');
                } else {
                    setQuizFeedback('incorrect');
                }

                e.preventDefault();
                if (quizFeedback) return;
                if (userInput.trim().toLowerCase() === quizWord.word.toLowerCase()) {

                                <button onClick={() => { setActiveTab('quiz'); setQuizMode(null); setQuizWord(null); setSearchTerm(''); }} className={`flex-1 sm:flex-none px-3 sm:px-5 py-2 rounded-lg text-xs sm:text-sm font-medium transition-all ${activeTab === 'quiz' ? 'bg-indigo-500 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>
                                    測驗模式
                                </button>
                                <div className="h-6 w-px bg-slate-700 mx-1 hidden sm:block"></div>

                                    className="bg-transparent text-slate-300 text-xs sm:text-sm font-medium outline-none cursor-pointer pl-1 sm:pl-2 pr-1 py-1 sm:py-0 w-full sm:w-auto text-center sm:text-left mt-2 sm:mt-0"

                                    onChange={(e) => setSelectedVoice(e.target.value)}
                                >
                                    <option value="US">🇺🇸 美式</option>
                                    <option value="UK">🇬🇧 英式</option>
                                    <option value="AU">🇦🇺 澳式</option>

                            </div>
                        </div>

                                                            <p className="text-slate-400 text-xs md:text-sm mt-2 break-words">{item.ch_sentence}</p>
                                                        </div>
                                                        <button onClick={() => handleSpeak(item.en_sentence)} className="shrink-0 mt-1 text-slate-500 hover:text-indigo-400 transition-colors">
                                                            <i className="fa-solid fa-volume-high"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {filteredData.length === 0 && (
                                    <div className="text-center py-20">
                                        <i className="fa-solid fa-box-open text-4xl text-slate-600 mb-4"></i>
                                        <p className="text-slate-400">找不到符合條件的單字，請嘗試其他關鍵字。</p>
                                    </div>
                                )}

                                {totalPages > 1 && (
                                    <div className="flex flex-col md:flex-row justify-center items-center gap-4 md:gap-6 mt-8 md:mt-12 mb-4 md:mb-8">
                                        <div className="flex justify-between sm:justify-center items-center gap-3 md:gap-4 bg-slate-800 p-2 rounded-2xl border border-slate-700 shadow-lg w-full md:w-auto">
                                            <button 
                                                onClick={() => handlePageChange(currentPage - 1)} 
                                                disabled={currentPage === 1}
                                                className={`w-10 h-10 shrink-0 rounded-xl flex items-center justify-center transition-colors ${currentPage === 1 ? 'bg-slate-900 text-slate-600 cursor-not-allowed' : 'bg-slate-700 text-white hover:bg-indigo-500'}`}
                                            >
                                                <i className="fa-solid fa-chevron-left"></i>
                                            </button>
                                            <span className="text-slate-300 font-medium px-2 sm:px-4 text-sm sm:text-base whitespace-nowrap">
                                                Page <span className="text-white">{currentPage}</span> of {totalPages}
                                            </span>
                                            <button 
                                                onClick={() => handlePageChange(currentPage + 1)} 
                                                disabled={currentPage === totalPages}
                                                className={`w-10 h-10 shrink-0 rounded-xl flex items-center justify-center transition-colors ${currentPage === totalPages ? 'bg-slate-900 text-slate-600 cursor-not-allowed' : 'bg-slate-700 text-white hover:bg-indigo-500'}`}
                                            >
                                                <i className="fa-solid fa-chevron-right"></i>
                                            </button>
                                        </div>
                                        
                                        <div className="flex justify-center items-center gap-2 bg-slate-800 p-2 rounded-2xl border border-slate-700 shadow-lg w-full md:w-auto">
                                            <input 
                                                type="number" 
                                                min="1" max={totalPages}
                                                value={jumpPage}
                                                onChange={(e) => setJumpPage(e.target.value)}
                                                onKeyDown={handleJumpPage}
                                                placeholder="頁碼"
                                                className="w-full md:w-20 h-10 bg-slate-900 text-white text-center text-sm rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 border border-slate-700 appearance-none"
                                            />
                                            <button 
                                                onClick={handleJumpPage}
                                                className="h-10 shrink-0 bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-6 rounded-xl transition-colors font-medium"
                                            >
                                                GO
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="max-w-2xl mx-auto mt-4 md:mt-10">
                                <div className="glass-panel rounded-2xl p-6 md:p-8 border border-slate-700 shadow-xl">
                                    {quizMode === null ? (
                                        // 選擇測驗模式與章節介面
                                        <div>
                                            <div className="mb-6 md:mb-8 max-w-sm mx-auto">
                                                <label className="block text-slate-400 text-xs md:text-sm font-medium mb-2 text-center">
                                                    <i className="fa-solid fa-book-open text-indigo-400 mr-2"></i>選擇測驗範圍
                                                </label>
                                                <select 
                                                    className="w-full bg-slate-800 text-slate-200 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 shadow-inner transition-colors text-sm md:text-base appearance-none text-center cursor-pointer"
                                                    value={selectedChapter}
                                                    onChange={(e) => setSelectedChapter(e.target.value)}
                                                >
                                                    <option value="all">綜合測驗 (All Chapters)</option>
                                                    <option value="1">Chapter 1: 職場單字</option>
                                                    <option value="2">Chapter 2: 差旅與社交</option>
                                                    <option value="3">Chapter 3: 商業與管理</option>
                                                    <option value="4">Chapter 4: 科技與熱門</option>
                                                </select>
                                            </div>

                                            <h2 className="text-xl md:text-2xl font-bold text-white mb-6 md:mb-8 text-center flex items-center justify-center gap-3">
                                                <i className="fa-solid fa-gamepad text-indigo-400"></i> 請選擇測驗模式
                                            </h2>
                                            <div className="flex flex-col gap-4 md:gap-5">
                                                <button onClick={() => startQuiz('listening')} className="bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 text-white p-5 md:p-6 rounded-2xl transition-all shadow-lg flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 group text-center sm:text-left">
                                                    <div className="w-14 h-14 md:w-16 md:h-16 rounded-full bg-slate-700 group-hover:bg-indigo-500/30 flex items-center justify-center shrink-0 transition-colors">
                                                        <i className="fa-solid fa-headphones text-2xl md:text-3xl text-indigo-400 group-hover:text-white"></i>
                                                    </div>
                                                    <div>
                                                        <h3 className="text-lg md:text-xl font-bold mb-1 tracking-wide">聽力測驗</h3>
                                                        <p className="text-slate-400 text-xs md:text-sm">單純聆聽英文發音，並選出正確的中文意思。</p>
                                                    </div>
                                                </button>
                                                
                                                <button onClick={() => startQuiz('meaning')} className="bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 text-white p-5 md:p-6 rounded-2xl transition-all shadow-lg flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 group text-center sm:text-left">
                                                    <div className="w-14 h-14 md:w-16 md:h-16 rounded-full bg-slate-700 group-hover:bg-indigo-500/30 flex items-center justify-center shrink-0 transition-colors">
                                                        <i className="fa-solid fa-language text-2xl md:text-3xl text-emerald-400 group-hover:text-white"></i>
                                                    </div>
                                                    <div>
                                                        <h3 className="text-lg md:text-xl font-bold mb-1 tracking-wide">字義測驗</h3>
                                                        <p className="text-slate-400 text-xs md:text-sm">看見並聆聽單字或搭配詞，選出正確的中文意思。</p>
                                                    </div>
                                                </button>

                                                <button onClick={() => startQuiz('spelling')} className="bg-slate-800 hover:bg-indigo-600 border border-slate-700 hover:border-indigo-500 text-white p-5 md:p-6 rounded-2xl transition-all shadow-lg flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 group text-center sm:text-left">
                                                    <div className="w-14 h-14 md:w-16 md:h-16 rounded-full bg-slate-700 group-hover:bg-indigo-500/30 flex items-center justify-center shrink-0 transition-colors">
                                                        <i className="fa-solid fa-keyboard text-2xl md:text-3xl text-amber-400 group-hover:text-white"></i>
                                                    </div>
                                                    <div>
                                                        <h3 className="text-lg md:text-xl font-bold mb-1 tracking-wide">拼字測驗</h3>
                                                        <p className="text-slate-400 text-xs md:text-sm">看中文提示並聆聽發音，親手拼寫出英文單字。</p>
                                                    </div>
                                                </button>
                                            </div>
                                        </div>
                                    ) : !quizWord ? (
                                        <div className="text-center py-10">
                                            <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-white mx-auto"></div>
                                        </div>
                                    ) : (
                                        // 測驗進行中介面
                                        <div>
                                            <div className="flex justify-between items-center mb-6 md:mb-8 border-b border-slate-700 pb-4">
                                                <button onClick={() => {setQuizMode(null); setQuizWord(null);}} className="text-slate-400 hover:text-white flex items-center gap-2 transition-colors font-medium text-sm md:text-base">
                                                    <i className="fa-solid fa-arrow-left"></i> 返回選單
                                                </button>
                                                <span className="px-3 md:px-4 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-[10px] md:text-xs text-slate-300 font-bold tracking-wider">
                                                    CHAPTER {quizWord.ch}
                                                </span>
                                            </div>

                                            {/* 題幹區塊 */}
                                            {quizMode === 'listening' && (
                                                <div className="mb-6 md:mb-8 text-center">
                                                    <button onClick={() => handleSpeak(quizWord.word)} className="w-16 h-16 md:w-20 md:h-20 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition-all shadow-lg shadow-indigo-500/30 mx-auto mb-4 md:mb-6">
                                                        <i className="fa-solid fa-volume-high text-2xl md:text-3xl"></i>
                                                    </button>
                                                    <p className="text-slate-400 text-xs md:text-sm">請聽發音，並選出正確的<span className="text-indigo-300 font-bold mx-1">中文意思</span>：</p>
                                                </div>
                                            )}

                                            {quizMode === 'meaning' && (
                                                <div className="mb-8 text-center">
                                                    <div className="flex flex-wrap justify-center items-center gap-3 md:gap-5 mb-3">
                                                        <h3 className={`font-bold text-white tracking-tight break-words ${isCollocationType ? 'text-2xl sm:text-3xl md:text-4xl' : 'text-3xl sm:text-4xl md:text-5xl'}`}>
                                                            {isCollocationType ? quizWord.collocation : quizWord.word}
                                                        </h3>
                                                        <button onClick={() => handleSpeak(isCollocationType ? quizWord.collocation : quizWord.word)} className="w-10 h-10 md:w-12 md:h-12 rounded-full bg-slate-800 hover:bg-indigo-500 text-white flex items-center justify-center transition-colors shadow-md shrink-0">
                                                            <i className="fa-solid fa-volume-high text-base md:text-lg"></i>
                                                        </button>
                                                    </div>
                                                    <p className="text-slate-400 text-xs md:text-sm mt-2 md:mt-4">請選出正確的中文意思：</p>
                                                </div>
                                            )}

                                            {quizMode === 'spelling' && (
                                                <div className="mb-6 md:mb-8">
                                                    <div className="flex justify-center mb-4 md:mb-6">
                                                        <button onClick={() => handleSpeak(quizWord.word)} className="w-16 h-16 md:w-20 md:h-20 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition-all shadow-lg shadow-indigo-500/30">
                                                            <i className="fa-solid fa-volume-high text-2xl md:text-3xl"></i>
                                                        </button>
                                                    </div>
                                                    <div className="p-4 md:p-6 rounded-xl bg-slate-800/50 border border-slate-700/50 text-center">
                                                        <p className="text-slate-400 text-xs md:text-sm mb-2">中文提示</p>
                                                        <p className="text-xl md:text-2xl text-white font-bold break-words">{quizWord.translation}</p>
                                                    </div>
                                                </div>
                                            )}

                                            {/* 作答區塊 (聽力 & 字義 選項為中文意思) */}
                                            {(quizMode === 'listening' || quizMode === 'meaning') && (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mb-6">
                                                    {quizOptions.map((opt, i) => {
                                                        let btnClass = "bg-slate-800 border-slate-700 text-slate-200 hover:bg-slate-700 hover:border-indigo-400";
                                                        if (quizFeedback) {
                                                            if (opt.id === quizWord.id) {
                                                                btnClass = "bg-green-600/20 border-green-500 text-green-300 font-bold";
                                                            } else if (quizFeedback === 'incorrect') {
                                                                btnClass = "bg-slate-800 border-slate-700 text-slate-500 opacity-50";
                                                            }
                                                        }

                                                        return (
                                                            <button 
                                                                key={i} 
                                                                onClick={() => handleChoiceSubmit(opt)}
                                                                disabled={quizFeedback !== null}
                                                                className={`w-full p-4 md:p-5 rounded-xl border text-left transition-all ${btnClass} flex items-center shadow-sm`}
                                                            >
                                                                <span className="w-7 h-7 md:w-8 md:h-8 rounded-lg bg-slate-900/60 flex items-center justify-center text-xs md:text-sm font-bold mr-3 md:mr-4 shrink-0 shadow-inner">
                                                                    {String.fromCharCode(65 + i)}
                                                                </span>
                                                                <span className="text-sm md:text-base lg:text-lg break-words">
                                                                    {opt.translation}
                                                                </span>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            )}

                                            {/* 作答區塊 (拼字) */}
                                            {quizMode === 'spelling' && (
                                                <form onSubmit={handleQuizSubmit} className="mb-6">
                                                    <input 
                                                        type="text" 
                                                        value={userInput}
                                                        onChange={(e) => setUserInput(e.target.value)}
                                                        disabled={quizFeedback !== null}
                                                        placeholder="請聽發音輸入英文單字..."
                                                        className={`w-full px-4 md:px-6 py-4 bg-slate-900 border-2 ${quizFeedback === 'correct' ? 'border-green-500 text-green-400 shadow-[0_0_15px_rgba(34,197,94,0.2)]' : quizFeedback === 'incorrect' ? 'border-red-500 text-red-400 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'border-slate-700 text-white focus:border-indigo-500 shadow-inner'} rounded-xl text-lg md:text-2xl outline-none transition-all text-center tracking-wider mb-4 md:mb-5 font-bold`}
                                                        autoFocus
                                                        autoComplete="off"
                                                        spellCheck="false"
                                                    />
                                                    {!quizFeedback && (
                                                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 md:py-4 rounded-xl font-bold text-base md:text-lg transition-colors shadow-lg">
                                                            確認送出
                                                        </button>
                                                    )}
                                                </form>
                                            )}

                                            {/* 回饋與下一步區塊 */}
                                            {quizFeedback === 'correct' && (
                                                <div className="p-4 md:p-5 rounded-xl bg-green-500/20 border border-green-500/40 text-center mb-6 md:mb-8 animate-pulse">
                                                    <p className="text-green-400 font-bold text-lg md:text-xl mb-1"><i className="fa-solid fa-circle-check mr-2"></i>完全正確！</p>
                                                    {quizMode !== 'meaning' && <p className="text-green-300 font-medium text-base md:text-lg mt-2 break-words">{quizWord.word} : {quizWord.translation}</p>}
                                                </div>
                                            )}
                                            {quizFeedback === 'incorrect' && (
                                                <div className="p-4 md:p-5 rounded-xl bg-red-500/20 border border-red-500/40 text-center mb-6 md:mb-8">
                                                    <p className="text-red-400 font-bold text-lg md:text-xl mb-2 md:mb-3"><i className="fa-solid fa-circle-xmark mr-2"></i>答錯了，再接再厲！</p>
                                                    <p className="text-slate-300 text-sm md:text-base break-words">正確答案是：<span className="text-white font-bold text-xl md:text-2xl mx-1 md:mx-2 tracking-wide underline decoration-red-500/50 underline-offset-4">{quizWord.word}</span> ({quizWord.translation})</p>
                                                </div>
                                            )}

                                            {quizFeedback && (
                                                <div className="flex flex-col-reverse sm:flex-row justify-center gap-3 md:gap-4">
                                                    <button onClick={() => {setQuizMode(null); setQuizWord(null);}} className="w-full sm:w-auto px-6 py-3 md:py-4 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 transition-colors font-medium text-sm md:text-base">
                                                        結束測驗
                                                    </button>
                                                    <button onClick={() => startQuiz(quizMode)} className="w-full sm:flex-1 max-w-none sm:max-w-xs py-3 md:py-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold transition-colors shadow-lg shadow-indigo-500/30 text-base md:text-lg flex items-center justify-center gap-2">
                                                        下一題 <i className="fa-solid fa-arrow-right"></i>
                                                    </button>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
